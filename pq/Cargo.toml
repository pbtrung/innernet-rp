[package]
name = "innernet-pq"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Durable authenticated post-quantum WireGuard PSK protocol"

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
thiserror = "2.0.20"
zeroize = { version = "1.9.0", features = ["derive"] }

[build-dependencies]
cc = "1.4.5"
pkg-config = "0.3.34"

[dev-dependencies]
tempfile = "3.27.0"

[features]
v6-test = []
