# M5 scenario: same server + peer-a/b/c topology as M4, on its own network
# so both can coexist. Every peer here carries the server's hardcoded
# persistent keepalive (25s, no per-peer override exists yet), so this
# exercises the "healthy keepalive-carrying tunnel is never paused by the
# idle timeout" half of testing.md scenario 7, plus A-B/A-C fair
# scheduling; see m5_inactivity.sh's header for the real-kernel scoping
# note on the genuinely-idle half.
services:
  server:
    image: innernet-pq-runtime:m5
    cap_add: [NET_ADMIN]
    networks:
      pq_m5:
        ipv4_address: 10.92.0.2
    volumes:
      - server_config:/etc/innernet-server
      - server_data:/var/lib/innernet-server
      - invites:/invites
      - ./scenarios/server-entrypoint-m5.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  peer-a:
    image: innernet-pq-runtime:m5
    cap_add: [NET_ADMIN]
    depends_on: [server]
    networks:
      pq_m5:
        ipv4_address: 10.92.0.3
    volumes:
      - peer_a_config:/etc/innernet
      - peer_a_data:/var/lib/innernet
      - invites:/invites
      - ./scenarios/peer-entrypoint-m5.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh", "peer-a"]

  peer-b:
    image: innernet-pq-runtime:m5
    cap_add: [NET_ADMIN]
    depends_on: [server]
    networks:
      pq_m5:
        ipv4_address: 10.92.0.4
    volumes:
      - peer_b_config:/etc/innernet
      - peer_b_data:/var/lib/innernet
      - invites:/invites
      - ./scenarios/peer-entrypoint-m5.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh", "peer-b"]

  peer-c:
    image: innernet-pq-runtime:m5
    cap_add: [NET_ADMIN]
    depends_on: [server]
    networks:
      pq_m5:
        ipv4_address: 10.92.0.5
    volumes:
      - peer_c_config:/etc/innernet
      - peer_c_data:/var/lib/innernet
      - invites:/invites
      - ./scenarios/peer-entrypoint-m5.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh", "peer-c"]

networks:
  pq_m5:
    internal: true
    ipam:
      config:
        - subnet: 10.92.0.0/24

volumes:
  server_config:
  server_data:
  peer_a_config:
  peer_a_data:
  peer_b_config:
  peer_b_data:
  peer_c_config:
  peer_c_data:
  invites:
